# ========== 开发环境 ==========
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        auto-startup: true
        concurrency: 1
        max-concurrency: 3
        acknowledge-mode: auto

logging:
  level:
    com.hpos: debug
    com.hpos.mapper: trace
