# 服务器配置
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.application.name=hospital-management
# JSP配置
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# 静态资源配置
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/static/
# MyBatis配置
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.hospital.entity
mybatis.configuration.map-underscore-to-camel-case=true
# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 日志配置
logging.level.com.hospital=DEBUG
logging.level.org.springframework.web=INFO
logging.file.name=logs/hospital.log
# 开发环境配置
spring.devtools.restart.enabled=true
spring.jpa.hibernate.ddl-auto=none
